# ============================================================================
# KITTY TERMINAL CONFIGURATION
# ============================================================================
# "There is nothing outside of yourself that can ever enable you to get better,
#  stronger, richer, quicker, or smarter. Everything is within."
# - Miyamoto Musashi
# ============================================================================

# ----------------------------------------------------------------------------
# FONTS
# ----------------------------------------------------------------------------
# "Think lightly of yourself and deeply of the world." - Miyamoto Musashi

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# Ligatures - where characters flow like water
disable_ligatures never

# ----------------------------------------------------------------------------
# CURSOR
# ----------------------------------------------------------------------------
# "Perceive that which cannot be seen with the eye." - Miyamoto Musashi

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ----------------------------------------------------------------------------
# SCROLLBACK
# ----------------------------------------------------------------------------
# "Study the past if you would define the future." - Miyamoto Musashi

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0

# ----------------------------------------------------------------------------
# MOUSE
# ----------------------------------------------------------------------------
# "Do nothing which is of no use." - Miyamoto Musashi

mouse_hide_wait 3.0
url_color #0087bd
url_style curly
open_url_with default
detect_urls yes
copy_on_select yes

# ----------------------------------------------------------------------------
# PERFORMANCE
# ----------------------------------------------------------------------------
# "The way of the warrior is resolute acceptance of death." - Miyamoto Musashi

repaint_delay 10
input_delay 3
sync_to_monitor yes

# ----------------------------------------------------------------------------
# BELL
# ----------------------------------------------------------------------------
# "Today is victory over yourself of yesterday." - Miyamoto Musashi

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# ----------------------------------------------------------------------------
# WINDOW LAYOUT
# ----------------------------------------------------------------------------
# "From one thing, know ten thousand things." - Miyamoto Musashi

remember_window_size  yes
initial_window_width  1400
initial_window_height 900

window_padding_width 8
window_margin_width 0

active_border_color #00ff00
inactive_border_color #cccccc
bell_border_color #ff5a00

# ----------------------------------------------------------------------------
# TAB BAR
# ----------------------------------------------------------------------------
# "You must understand that there is more than one path to the top of the mountain." - Miyamoto Musashi

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

active_tab_foreground   #000
active_tab_background   #eee
inactive_tab_foreground #444
inactive_tab_background #999

# ----------------------------------------------------------------------------
# COLOR SCHEME
# ----------------------------------------------------------------------------
# "Truth is not what you want it to be; it is what it is." - Miyamoto Musashi

foreground #dddddd
background #1a1a1a
background_opacity 0.95

# Black
color0 #000000
color8 #545454

color1 #ff5555
color9 #ff5555

color2  #50fa7b
color10 #50fa7b

color3  #f1fa8c
color11 #f1fa8c

color4  #bd93f9
color12 #bd93f9

color5  #ff79c6
color13 #ff79c6

color6  #8be9fd
color14 #8be9fd

color7  #bbbbbb
color15 #ffffff

# ----------------------------------------------------------------------------
# ADVANCED SETTINGS
# ----------------------------------------------------------------------------
# "The ultimate aim of martial arts is not having to use them." - Miyamoto Musashi

shell .
editor .
allow_remote_control yes
listen_on unix:/tmp/kitty

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ----------------------------------------------------------------------------
# KEYBOARD SHORTCUTS
# ----------------------------------------------------------------------------
# "A thousand days of training to develop, ten thousand days of training to polish." - Miyamoto Musashi
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

map cmd+enter new_window
map cmd+w close_window
map cmd+] next_window
map cmd+[ previous_window

map cmd+t new_tab
map cmd+shift+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

map cmd+plus change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0

map cmd+shift+r load_config_file

# ----------------------------------------------------------------------------
# MACOS SPECIFIC
# ----------------------------------------------------------------------------
# "Get beyond love and grief: exist for the good of all." - Miyamoto Musashi

macos_titlebar_color background
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# ----------------------------------------------------------------------------
# ============================================================================
# "The path that leads to truth is littered with the bodies of the ignorant."
# - Miyamoto Musashi
#
# Walk the way of strategy, one command at a time.
# ============================================================================
